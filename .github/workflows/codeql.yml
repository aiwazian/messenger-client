name: "CodeQL Advanced"

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    - cron: '38 21 * * 2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
            
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDK 21
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Gradle
      if: matrix.language == 'java-kotlin'
      uses: gradle/actions/setup-gradle@v5

    - name: Create google-services.json
      if: matrix.language == 'java-kotlin'
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo "::error::Secret GOOGLE_SERVICES_JSON is empty or not available"
          exit 1
        fi
        printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
        python3 -c "import json;json.load(open('app/google-services.json'))"
        echo "OK, $(wc -c < app/google-services.json) bytes"
      
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended

    - name: Build Android app
      if: matrix.language == 'java-kotlin'
      run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugSources --no-daemon --build-cache \
            -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs="-Xmx4g"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
